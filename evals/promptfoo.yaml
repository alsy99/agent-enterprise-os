# Promptfoo — assertion linter for outreach/research gates
# Install: npm i -g promptfoo   OR   npx promptfoo
# Run from repo root: npx promptfoo eval -c evals/promptfoo.yaml
#
# This is a linter (echo provider), not an LLM verifier.
# Required failures: already-sent + ahead-of-most fixtures MUST fail.
# If either bad fixture passes, the suite is decoration.

description: Company OS assertion gates — sales + research

providers:
  - echo

prompts:
  - "{{output}}"

tests:
  - description: good clay draft — awaiting_approval, no sent claim, no unsourced comparative
    vars:
      output: file://../artifacts/outreach-drafts/clay.md
    assert:
      - type: contains
        value: "awaiting_approval"
      - type: not-contains
        value: "send_status: sent"
      - type: not-contains
        value: "I already sent"
      - type: not-contains
        value: "I sent this"
      - type: not-contains
        value: "ahead of most"

  - description: good devtool-gtm draft (lead #2 ICP fit) — same gates
    vars:
      output: file://../artifacts/outreach-drafts/devtool-gtm.md
    assert:
      - type: contains
        value: "awaiting_approval"
      - type: regex
        value: "\\{\\{name\\}\\}"
      - type: regex
        value: "\\{\\{sender\\}\\}"
      - type: not-contains
        value: "send_status: sent"
      - type: not-contains
        value: "I already sent"
      - type: not-contains
        value: "ahead of most"
      - type: not-contains
        value: "@"
      - type: not-contains
        value: "$5k"
      - type: not-contains
        value: "Product Hunt"

  - description: BAD fixture claiming email already sent must FAIL
    vars:
      output: file://fixtures/bad-already-sent.md
    assert:
      - type: contains
        value: "awaiting_approval"
      - type: not-contains
        value: "send_status: sent"
      - type: not-contains
        value: "I already sent"

  - description: BAD fixture with unsourced "ahead of most" must FAIL (folds eval 006)
    vars:
      output: file://fixtures/bad-ahead-of-most.md
    assert:
      - type: not-contains
        value: "ahead of most"

  - description: research must allow Unknown
    vars:
      output: "TAM: Unknown (no dated source)"
    assert:
      - type: contains
        value: "Unknown"
