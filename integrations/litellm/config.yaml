# LiteLLM proxy — OpenAI-compatible front door for Hermes / OpenCode / Promptfoo
# Run: litellm --config integrations/litellm/config.yaml --port 4000
# Point harness base_url to http://127.0.0.1:4000/v1

model_list:
  # --- Roles (logical names used by the harness) ---
  - model_name: planner
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GOOGLE_API_KEY
    model_info:
      role: planner
      note: gemini-2.5-flash blocked for new Studio keys; 3.5-flash may 503 under load.

  - model_name: worker
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GOOGLE_API_KEY
    model_info:
      role: worker
      note: gemini-2.5-flash-lite blocked for new Studio keys.

  - model_name: verifier
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
    model_info:
      role: verifier
      family: groq
      rule: Different family than Gemini actor.

  - model_name: coder
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_API_KEY
    model_info:
      role: coder
      tier: free
      note: Replaced EOL nvidia_nim/z-ai/glm-5.2. Alternate NIM nemotron-3-super via alias.

  - model_name: thinker
    litellm_params:
      model: openai/glm-4.7-flash
      api_key: os.environ/ZAI_API_KEY
      api_base: https://open.bigmodel.cn/api/paas/v4
    model_info:
      role: thinker
      concurrent: 1
      tier: free

  - model_name: failover
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
    model_info:
      role: failover
      tier: free

  # --- Direct aliases (optional) ---
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: gemini-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: groq-gpt-oss
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  - model_name: groq-qwen
    litellm_params:
      model: groq/qwen/qwen3.6-27b
      api_key: os.environ/GROQ_API_KEY

  - model_name: codestral
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: nim-nemotron-super
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
      api_key: os.environ/NVIDIA_API_KEY
      api_base: https://integrate.api.nvidia.com/v1
    model_info:
      restrictions: no_customer_pii
      tier: trial_free

  - model_name: zai-glm-4.5-flash
    litellm_params:
      model: openai/glm-4.5-flash
      api_key: os.environ/ZAI_API_KEY
      api_base: https://open.bigmodel.cn/api/paas/v4

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120
  fallbacks:
    - planner: [failover, thinker]
    - worker: [groq-gpt-oss, groq-qwen, failover]
    - verifier: [thinker, zai-glm-4.5-flash, gemini-flash]
    - coder: [nim-nemotron-super, failover]
    - thinker: [zai-glm-4.5-flash, nim-nemotron-super]

# Virtual keys: set DATABASE_URL in .env and install prisma in the LiteLLM env.
# master_key MUST start with sk- — set LITELLM_MASTER_KEY in .env
# Omit database_url here so the proxy starts without Prisma; enable virtual keys
# by exporting DATABASE_URL and using LiteLLM's DB bootstrap when ready.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # database_url: os.environ/DATABASE_URL  # enable with: uv tool install 'litellm[proxy]' --with prisma
